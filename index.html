<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Waterfall</title>
    <link rel="stylesheet" href="./fonts/fonts.css" />
    <link rel="stylesheet" href="./chart.css" />
    <script src="./icons.js"></script>
    <script src="./config.js"></script>
    <script src="./chart.js"></script>
  </head>

  <body>
    <div id="card" class="card is-empty">
      <div class="head">
        <div id="icon" class="icon" aria-hidden="true"></div>
        <div id="title" class="title"></div>
        <div id="explanation" class="explanation"></div>
      </div>

      <div id="plot" class="plot">
        <svg id="svg" class="svg" role="img" aria-label="Waterfall chart"></svg>
      </div>

      <div id="hint" class="hint"></div>
    </div>

    <div id="tooltip" class="tooltip" role="tooltip"></div>
    <div id="menu" class="menu" role="menu"></div>

    <script>
      // Dev preview only: index.html?mock loads a stand-in for the Tableau API.
      if (/[?&]mock\b/.test(location.search)) document.write('<script src="./dev/mock.js"><\/script>');
    </script>
    <script>
      // Loads the Tableau Extensions API: vendored copy first, CDN fallback.
      (function () {
        var SOURCES = [
          './lib/tableau.extensions.1.latest.js',
          'https://cdn.jsdelivr.net/gh/tableau/extensions-api@main/lib/tableau.extensions.1.latest.js'
        ];
        function load (i) {
          if (i >= SOURCES.length) {
            document.getElementById('hint').textContent =
              'Could not load the Tableau Extensions API library.';
            return;
          }
          var s = document.createElement('script');
          s.src = SOURCES[i];
          s.onload = function () { window.Waterfall.init(); };
          s.onerror = function () { load(i + 1); };
          document.head.appendChild(s);
        }
        if (window.tableau && window.tableau.extensions) {
          window.Waterfall.init();
        } else {
          load(0);
        }
      })();
    </script>
  </body>
</html>
